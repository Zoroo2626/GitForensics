name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatchling pytest pytest-cov ruff mypy build
          python -m pip install -e .

      - name: Run ruff lint check
        run: python -m ruff check .

      - name: Run ruff format check
        run: python -m ruff format --check .

      - name: Run mypy type check
        run: python -m mypy src

      - name: Run pytest with coverage
        run: python -m pytest --cov=gitforensics --cov-report=term-missing

      - name: Build distribution packages
        run: python -m build

      - name: Smoke test clean wheel installation
        run: |
          python -m venv .smoke_env
          ${{ runner.os == 'Windows' && '.smoke_env\Scripts\python.exe' || '.smoke_env/bin/python' }} -m pip install dist/*.whl
          ${{ runner.os == 'Windows' && '.smoke_env\Scripts\gitforensics.exe' || '.smoke_env/bin/gitforensics' }} --help
          ${{ runner.os == 'Windows' && '.smoke_env\Scripts\gitforensics.exe' || '.smoke_env/bin/gitforensics' }} --version
          ${{ runner.os == 'Windows' && '.smoke_env\Scripts\gitforensics.exe' || '.smoke_env/bin/gitforensics' }} scan --help
          ${{ runner.os == 'Windows' && '.smoke_env\Scripts\python.exe' || '.smoke_env/bin/python' }} -m gitforensics --help
