name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatchling pytest pytest-cov ruff mypy build
          python -m pip install -e .

      - name: Run ruff lint check
        run: python -m ruff check .

      - name: Run ruff format check
        run: python -m ruff format --check .

      - name: Run mypy type check
        run: python -m mypy src

      - name: Run pytest with coverage
        run: python -m pytest --cov=gitforensics --cov-report=term-missing

      - name: Build distribution packages
        run: python -m build

      - name: Smoke test clean wheel installation
        run: |
          python -m venv .smoke_env
          python -c "import pathlib, subprocess, sys; scripts = 'Scripts' if sys.platform == 'win32' else 'bin'; python = pathlib.Path('.smoke_env') / scripts / ('python.exe' if sys.platform == 'win32' else 'python'); cli = pathlib.Path('.smoke_env') / scripts / ('gitforensics.exe' if sys.platform == 'win32' else 'gitforensics'); wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([str(python), '-m', 'pip', 'install', str(wheel)]); subprocess.check_call([str(cli), '--help']); subprocess.check_call([str(cli), '--version']); subprocess.check_call([str(cli), 'scan', '--help']); subprocess.check_call([str(python), '-m', 'gitforensics', '--help'])"
